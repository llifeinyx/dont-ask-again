name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # LFS downloads count against the repository's monthly bandwidth, so keep the objects between runs.
      - name: Name the LFS cache after the objects it holds
        id: lfs
        run: echo "key=lfs-$(git lfs ls-files --long | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ steps.lfs.outputs.key }}

      - name: Check out LFS files
        run: |
          git lfs install --local
          git lfs pull

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot
          key: godot-${{ hashFiles('tools/ci/install_godot.sh') }}

      - name: Install Godot, Xvfb and a software Vulkan driver
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers xvfb xauth
          tools/ci/install_godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Checks
        run: CHECK_OUT="$RUNNER_TEMP/check" tools/check.sh

      # Godot writes a .uid next to every new script; a missing one shows up here.
      - name: Nothing generated is left uncommitted
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            echo "Commit these files (or ignore them in .gitignore)."
            exit 1
          fi

      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-output
          path: ${{ runner.temp }}/check
